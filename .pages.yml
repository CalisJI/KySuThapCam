media:
  input: site/media
  output: /media

content:
  - name: site-content
    label: Nội dung trang (Tiếng Việt)
    type: file
    path: content/site.json
    format: json
    fields:
      - name: siteTitle
        label: Tiêu đề trang (tab trình duyệt)
        type: string
      - name: metaDescription
        label: Mô tả cho Google
        type: text
      - name: heroTitle
        label: Tiêu đề chính
        type: string
      - name: heroHighlight
        label: Dòng nhấn mạnh
        type: string
      - name: heroDescription
        label: Mô tả đầu trang
        type: text
      - name: phoneDisplay
        label: Số điện thoại hiển thị
        type: string
      - name: phoneLink
        label: Số điện thoại liên kết (dạng +84...)
        type: string
      - name: contactEmail
        label: Email liên hệ
        type: string
      - name: fbUrl
        label: Đường dẫn Fanpage
        type: string
      - name: showBlog
        label: Hiện phần chia sẻ bài viết
        type: boolean
      - name: fields
        label: Lĩnh vực dịch vụ
        type: object
        list: true
        fields:
          - name: tag
            label: Nhãn
            type: string
          - name: color
            label: Màu nhấn (mã hex)
            type: string
          - name: title
            label: Tiêu đề
            type: string
          - name: desc
            label: Mô tả
            type: text
          - name: items
            label: Các hạng mục
            type: string
            list: true
      - name: products
        label: Thiết bị
        type: object
        list: true
        fields:
          - name: name
            label: Tên thiết bị
            type: string
          - name: image
            label: Ảnh thiết bị
            type: image
          - name: href
            label: Liên kết / nút hỏi giá
            type: string
          - name: cta
            label: Chữ trên nút
            type: string
      - name: steps
        label: Quy trình
        type: object
        list: true
        fields:
          - name: num
            label: Số thứ tự / nhãn
            type: string
          - name: title
            label: Tiêu đề bước
            type: string
          - name: desc
            label: Mô tả bước
            type: text
      - name: projects
        label: Dự án tiêu biểu
        type: object
        list: true
        fields:
          - name: image
            label: Ảnh dự án
            type: image
          - name: tag
            label: Nhãn
            type: string
          - name: title
            label: Tên dự án
            type: string
          - name: desc
            label: Mô tả
            type: text
      - name: faqs
        label: Hỏi đáp
        type: object
        list: true
        fields:
          - name: q
            label: Câu hỏi
            type: string
          - name: a
            label: Trả lời
            type: text
      - name: ui
        label: Các dòng chữ cố định (menu, tiêu đề mục, nút, chân trang)
        type: object
        fields:
          - name: topbar
            label: "Thanh trên cùng"
            type: string
          - name: city
            label: "Thành phố"
            type: string
          - name: tagline
            label: "Dòng phụ dưới logo"
            type: string
          - name: navFields
            label: "Menu: Lĩnh vực"
            type: string
          - name: navDevices
            label: "Menu: Thiết bị"
            type: string
          - name: navHow
            label: "Menu: Cách hoạt động"
            type: string
          - name: navProjects
            label: "Menu: Dự án"
            type: string
          - name: navShare
            label: "Menu: Chia sẻ"
            type: string
          - name: navFaq
            label: "Menu: Hỏi đáp"
            type: string
          - name: navCta
            label: "Menu: Nút gửi nhu cầu"
            type: string
          - name: heroKicker
            label: "Đầu trang: dòng nhỏ phía trên"
            type: string
          - name: heroCta1
            label: "Đầu trang: nút 1"
            type: string
          - name: heroCta2
            label: "Đầu trang: nút 2"
            type: string
          - name: stats
            label: Dải 4 ô giới thiệu
            type: object
            list: true
            fields:
              - name: title
                label: Tiêu đề ô
                type: string
              - name: sub
                label: Mô tả ô
                type: string
          - name: fieldsKicker
            label: "Lĩnh vực: dòng nhỏ"
            type: string
          - name: fieldsTitleA
            label: "Lĩnh vực: tiêu đề dòng 1"
            type: string
          - name: fieldsTitleB
            label: "Lĩnh vực: tiêu đề dòng 2"
            type: string
          - name: devicesKicker
            label: "Thiết bị: dòng nhỏ"
            type: string
          - name: devicesTitle
            label: "Thiết bị: tiêu đề"
            type: string
          - name: howKicker
            label: "Cách hoạt động: dòng nhỏ"
            type: string
          - name: howTitleA
            label: "Cách hoạt động: tiêu đề dòng 1"
            type: string
          - name: howTitleB
            label: "Cách hoạt động: tiêu đề dòng 2"
            type: string
          - name: howDesc
            label: "Cách hoạt động: mô tả"
            type: text
          - name: howCta
            label: "Cách hoạt động: nút"
            type: string
          - name: projKicker
            label: "Dự án: dòng nhỏ"
            type: string
          - name: projTitle
            label: "Dự án: tiêu đề"
            type: string
          - name: projDesc
            label: "Dự án: mô tả"
            type: text
          - name: blogKicker
            label: "Chia sẻ: dòng nhỏ"
            type: string
          - name: blogTitle
            label: "Chia sẻ: tiêu đề"
            type: string
          - name: blogAll
            label: "Chia sẻ: liên kết xem tất cả"
            type: string
          - name: contactKicker
            label: "Liên hệ: dòng nhỏ"
            type: string
          - name: contactTitle
            label: "Liên hệ: tiêu đề"
            type: string
          - name: contactDesc
            label: "Liên hệ: mô tả"
            type: text
          - name: contactFb
            label: "Liên hệ: nút Fanpage"
            type: string
          - name: mailSubject
            label: "Liên hệ: tiêu đề email mặc định"
            type: string
          - name: faqKicker
            label: "Hỏi đáp: dòng nhỏ"
            type: string
          - name: faqTitle
            label: "Hỏi đáp: tiêu đề"
            type: string
          - name: faqDesc
            label: "Hỏi đáp: mô tả"
            type: text
          - name: footerCopy
            label: "Chân trang: bản quyền"
            type: string
          - name: footPhone
            label: "Chân trang: Điện thoại"
            type: string
          - name: footEmail
            label: "Chân trang: Email"
            type: string
          - name: footFb
            label: "Chân trang: Fanpage"
            type: string
          - name: footTop
            label: "Chân trang: Lên đầu"
            type: string
          - name: defaultCta
            label: "Chữ nút mặc định trên thiết bị"
            type: string
          - name: articleCta
            label: "Trang bài viết: lời kêu gọi cuối bài"
            type: text
          - name: backHome
            label: "Trang bài viết: nút về trang chủ"
            type: string
          - name: listDesc
            label: "Trang danh sách: mô tả SEO"
            type: text
