        label: Tiêu đề ô
        type: string
      - name: sub
        label: Mô tả ô
        type: string
    - name: fieldsKicker
      label: 'Lĩnh vực: dòng nhỏ'
      type: string
    - name: fieldsTitleA
      label: 'Lĩnh vực: tiêu đề dòng 1'
      type: string
    - name: fieldsTitleB
      label: 'Lĩnh vực: tiêu đề dòng 2'
      type: string
    - name: devicesKicker
      label: 'Thiết bị: dòng nhỏ'
      type: string
    - name: devicesTitle
      label: 'Thiết bị: tiêu đề'
      type: string
    - name: howKicker
      label: 'Cách hoạt động: dòng nhỏ'
      type: string
    - name: howTitleA
      label: 'Cách hoạt động: tiêu đề dòng 1'
      type: string
    - name: howTitleB
      label: 'Cách hoạt động: tiêu đề dòng 2'
      type: string
    - name: howDesc
      label: 'Cách hoạt động: mô tả'
      type: text
    - name: howCta
      label: 'Cách hoạt động: nút'
      type: string
    - name: projKicker
      label: 'Dự án: dòng nhỏ'
      type: string
    - name: projTitle
      label: 'Dự án: tiêu đề'
      type: string
    - name: projDesc
      label: 'Dự án: mô tả'
      type: text
    - name: blogKicker
      label: 'Chia sẻ: dòng nhỏ'
      type: string
    - name: blogTitle
      label: 'Chia sẻ: tiêu đề'
      type: string
    - name: blogAll
      label: 'Chia sẻ: liên kết xem tất cả'
      type: string
    - name: contactKicker
      label: 'Liên hệ: dòng nhỏ'
      type: string
    - name: contactTitle
      label: 'Liên hệ: tiêu đề'
      type: string
    - name: contactDesc
      label: 'Liên hệ: mô tả'
      type: text
    - name: contactFb
      label: 'Liên hệ: nút Fanpage'
      type: string
    - name: mailSubject
      label: 'Liên hệ: tiêu đề email mặc định'
      type: string
    - name: faqKicker
      label: 'Hỏi đáp: dòng nhỏ'
      type: string
    - name: faqTitle
      label: 'Hỏi đáp: tiêu đề'
      type: string
    - name: faqDesc
      label: 'Hỏi đáp: mô tả'
      type: text
    - name: footerCopy
      label: 'Chân trang: bản quyền'
      type: string
    - name: footPhone
      label: 'Chân trang: Điện thoại'
      type: string
    - name: footEmail
      label: 'Chân trang: Email'
      type: string
    - name: footFb
      label: 'Chân trang: Fanpage'
      type: string
    - name: footTop
      label: 'Chân trang: Lên đầu'
      type: string
    - name: defaultCta
      label: Chữ nút mặc định trên thiết bị
      type: string
    - name: articleCta
      label: 'Trang bài viết: lời kêu gọi cuối bài'
      type: text
    - name: backHome
      label: 'Trang bài viết: nút về trang chủ'
      type: string
    - name: listDesc
      label: 'Trang danh sách: mô tả SEO'
      type: text
    - name: readMore
      label: 'Trang tin tức: chữ "đọc bài" ở bài nổi bật'
      type: string
    - name: blogFilterAll
      label: 'Trang tin tức: nút lọc "Tất cả"'
      type: string
    - name: blogMore
      label: 'Trang tin tức: nút xem thêm'
      type: string
