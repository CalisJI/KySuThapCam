- name: articles
  label: Bài viết chia sẻ (Tiếng Việt)
  type: collection
  path: content/posts
  format: yaml-frontmatter
  filename: '{primary}.md'
  view:
    fields:
    - title
    - date
    - tag
    primary: title
    sort:
    - date
    default:
      sort: date
      order: desc
  fields:
  - name: title
    label: Tiêu đề bài viết
    type: string
    required: true
  - name: date
    label: Ngày đăng
    type: date
    required: true
  - name: tag
    label: Chủ đề (PLC, IoT, Biến tần...)
    type: string
  - name: color
    label: Màu nhấn (mã hex, vd
    type: string
  - name: cover
    label: Ảnh đại diện
    type: image
  - name: excerpt
    label: Mô tả ngắn (hiện trên trang chủ)
    type: text
  - name: translation
    label: Bài tương ứng bản English (để nút đổi ngôn ngữ mở đúng bài này)
    type: reference
    options:
      collection: articles-en
      search: title
      value: '{path}'
      label: '{primary}'
  - name: draft
    label: Nháp (không hiển thị)
    type: boolean
  - name: body
    label: Nội dung
    type: rich-text
- name: articles-en
  label: Bài viết chia sẻ (English)
  type: collection
  path: content/posts-en
  format: yaml-frontmatter
  filename: '{primary}.md'
  view:
    fields:
    - title
    - date
    - tag
    primary: title
    sort:
    - date
    default:
      sort: date
      order: desc
  fields:
  - name: title
    label: Tiêu đề bài viết
    type: string
    required: true
  - name: date
    label: Ngày đăng
    type: date
    required: true
  - name: tag
    label: Chủ đề (PLC, IoT, Biến tần...)
    type: string
  - name: color
    label: Màu nhấn (mã hex, vd
    type: string
  - name: cover
    label: Ảnh đại diện
    type: image
  - name: excerpt
    label: Mô tả ngắn (hiện trên trang chủ)
    type: text
  - name: translation
    label: Bài tương ứng bản Tiếng Việt (để nút đổi ngôn ngữ mở đúng bài này)
    type: reference
    options:
      collection: articles
      search: title
      value: '{path}'
      label: '{primary}'
  - name: draft
    label: Nháp (không hiển thị)
    type: boolean
  - name: body
    label: Nội dung
    type: rich-text
