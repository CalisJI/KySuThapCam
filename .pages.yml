media:
  input: site/media
  output: /media
content:
- name: site-content
  label: Nội dung trang (Tiếng Việt) + danh sách dùng chung
  type: file
  path: content/site.json
  format: json
  fields:
  - name: logo
    label: Logo website (hiện ở đầu trang; vuông, tối thiểu 256x256)
    type: image
  - name: siteTitle
    label: Tiêu đề trang (tab trình duyệt)
    type: string
  - name: metaDescription
    label: Mô tả cho Google
    type: text
  - name: heroTitle
    label: Tiêu đề chính
    type: string
  - name: heroHighlight
    label: Dòng nhấn mạnh
    type: string
  - name: heroDescription
    label: Mô tả đầu trang
    type: text
  - name: phoneDisplay
    label: Số điện thoại hiển thị
    type: string
  - name: phoneLink
    label: Số điện thoại liên kết (dạng +84...)
    type: string
  - name: contactEmail
    label: Email liên hệ
    type: string
  - name: fbUrl
    label: Đường dẫn Fanpage
    type: string
  - name: analyticsToken
    label: Mã đếm truy cập Cloudflare Web Analytics (token 32 ký tự; để trống = tắt)
    type: string
  - name: googleVerification
    label: Mã xác minh Google Search Console (chỉ phần content="..." của thẻ meta; để trống nếu chưa dùng)
    type: string
  - name: siteUrl
    label: Địa chỉ website chính thức (vd https://kysuthapcam.com)
    type: string
  - name: showBlog
    label: Hiện phần chia sẻ bài viết
    type: boolean
  - name: fields
    label: Lĩnh vực dịch vụ (nhập cả Tiếng Việt và English tại đây)
    type: object
    list: true
    fields:
    - name: tag
      label: Nhãn
      type: string
    - name: tagEn
      label: Nhãn (English)
      type: string
    - name: color
      label: Màu nhấn (mã hex)
      type: string
    - name: title
      label: Tiêu đề
      type: string
    - name: titleEn
      label: Tiêu đề (English)
      type: string
    - name: desc
      label: Mô tả
      type: text
    - name: descEn
      label: Mô tả (English)
      type: text
    - name: items
      label: Các hạng mục
      type: string
      list: true
    - name: itemsEn
      label: Các hạng mục (English)
      type: string
      list: true
  - name: products
    label: Thiết bị (nhập cả Tiếng Việt và English tại đây)
    type: object
    list: true
    fields:
    - name: name
      label: Tên thiết bị
      type: string
    - name: nameEn
      label: Tên (English)
      type: string
    - name: image
      label: Ảnh thiết bị
      type: image
    - name: href
      label: Liên kết / nút hỏi giá
      type: string
    - name: cta
      label: Chữ trên nút
      type: string
    - name: ctaEn
      label: Chữ trên nút (English)
      type: string
  - name: steps
    label: Quy trình (nhập cả Tiếng Việt và English tại đây)
    type: object
    list: true
    fields:
    - name: num
      label: Số thứ tự / nhãn
      type: string
    - name: numEn
      label: Số thứ tự / nhãn (English)
      type: string
    - name: title
      label: Tiêu đề bước
      type: string
    - name: titleEn
      label: Tiêu đề (English)
      type: string
    - name: desc
      label: Mô tả bước
      type: text
    - name: descEn
      label: Mô tả (English)
      type: text
  - name: projects
    label: Dự án tiêu biểu (nhập cả Tiếng Việt và English tại đây)
    type: object
    list: true
    fields:
    - name: image
      label: Ảnh dự án
      type: image
    - name: tag
      label: Nhãn
      type: string
    - name: tagEn
      label: Nhãn (English)
      type: string
    - name: title
      label: Tên dự án
      type: string
    - name: titleEn
      label: Tiêu đề (English)
      type: string
    - name: desc
      label: Mô tả
      type: text
    - name: descEn
      label: Mô tả (English)
      type: text
  - name: faqs
    label: Hỏi đáp (nhập cả Tiếng Việt và English tại đây)
    type: object
    list: true
    fields:
    - name: q
      label: Câu hỏi
      type: string
    - name: qEn
      label: Câu hỏi (English)
      type: string
    - name: a
      label: Trả lời
      type: text
    - name: aEn
      label: Trả lời (English)
      type: text
  - name: ui
    label: Các dòng chữ cố định (menu, tiêu đề mục, nút, chân trang)
    type: object
    fields:
    - name: topbar
      label: Thanh trên cùng
      type: string
    - name: city
      label: Thành phố
      type: string
    - name: tagline
      label: Dòng phụ dưới logo
      type: string
    - name: navFields
      label: 'Menu: Lĩnh vực'
      type: string
    - name: navDevices
      label: 'Menu: Thiết bị'
      type: string
    - name: navHow
      label: 'Menu: Cách hoạt động'
      type: string
    - name: navProjects
      label: 'Menu: Dự án'
      type: string
    - name: navShare
      label: 'Menu: Tin tức'
      type: string
    - name: navFaq
      label: 'Menu: Hỏi đáp'
      type: string
    - name: navCta
      label: 'Menu: Nút gửi nhu cầu'
      type: string
    - name: heroKicker
      label: 'Đầu trang: dòng nhỏ phía trên'
      type: string
    - name: heroCta1
      label: 'Đầu trang: nút 1'
      type: string
    - name: heroCta2
      label: 'Đầu trang: nút 2'
      type: string
    - name: stats
      label: Dải 4 ô giới thiệu
      type: object
      list: true
      fields:
